# docker-compose.yml
# Local multi-container orchestration: the API and dashboard as separate
# services (mirroring how they'd be deployed independently in production),
# sharing a volume for bootstrapped data/model artifacts, plus an MLflow
# tracking server for experiment logging.
#
# Run:  docker compose up --build
#   API:        http://localhost:8000/docs
#   Dashboard:  http://localhost:8501
#   MLflow UI:  http://localhost:5000
#
# NOTE: not built/run from this sandboxed environment (no Docker Hub
# network access here) — validated for YAML correctness and logical
# consistency with the Dockerfiles/app code, not for an actual `docker
# compose up`. Please run a smoke test after cloning locally before
# relying on this for a demo.

services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: treasury-api:latest
    init: true   # see note on the dashboard service — same zombie-reaping fix
    ports:
      - "8000:8000"
    environment:
      - DATA_DIR=/app/data
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    volumes:
      - treasury-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    image: treasury-dashboard:latest
    # init:true runs a lightweight init process (tini) as PID 1 inside the
    # container, which correctly forwards signals and reaps zombie child
    # processes. Streamlit's live-mode rerun loop spawns subprocesses that
    # weren't being reaped without this, which surfaced as `docker compose
    # down` hanging with "container ... is zombie and can not be killed."
    # See NOTES.md for the exact failure this fixes.
    init: true
    ports:
      - "8501:8501"
    environment:
      - DATA_DIR=/app/data
    volumes:
      - treasury-data:/app/data
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  mlflow:
    build:
      context: .
      dockerfile: mlflow/Dockerfile
    image: treasury-mlflow:latest
    init: true   # see note on the dashboard service — same zombie-reaping fix
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlflow
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
    restart: unless-stopped

volumes:
  treasury-data:
  mlflow-data:
